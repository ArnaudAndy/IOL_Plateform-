# ============================================================================
# source-gateway — passerelle de lecture des sources
#
# Ce service n'expose aucun port public. Son entree metier est le topic des
# ordres de transport; son interface interne (decouverte, estimation) sera
# protegee par mTLS sur le reseau isole.
# ============================================================================

spring:
  application:
    name: source-gateway

  # Le compte MongoDB lit les workflows et n'ecrit que dans sa collection de
  # reservations `transport_claims`; son role production borne ces privileges.
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/iol_metadata?serverSelectionTimeoutMS=3000&connectTimeoutMS=3000}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Memes garanties que dans api-core: les lots d'un transfert partagent la
      # cle d'execution donc la partition, et l'idempotence interdit qu'un
      # renvoi apres erreur reseau duplique ou reordonne.
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 300000
        linger.ms: ${APP_KAFKA_PRODUCER_LINGER_MS:20}
        batch.size: ${APP_KAFKA_PRODUCER_BATCH_SIZE:131072}
        compression.type: ${APP_KAFKA_PRODUCER_COMPRESSION:lz4}

server:
  port: ${SERVER_PORT:8087}

management:
  server:
    port: ${MANAGEMENT_PORT:8088}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,mongo,sourceGatewayDependencies
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    com.iol.etlplatform.sourcegateway: DEBUG

app:
  tenancy:
    default-organization-id: ${APP_TENANCY_DEFAULT_ORGANIZATION_ID:iol-default}

  # Dechiffrement des identifiants source. Doit rester aligne sur api-core: les
  # deux services lisent les MEMES enveloppes, et le contexte de dechiffrement
  # (environnement, proprietaire, connexion, usage) est une donnee authentifiee.
  # Un environnement different d'un cote rend les secrets illisibles de l'autre.
  credentials:
    provider: ${CREDENTIAL_PROVIDER:LOCAL_AES_GCM}
    environment: ${CREDENTIAL_ENVIRONMENT:development}
    aes-key: ${CREDENTIAL_AES_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    allow-legacy-plaintext: ${CREDENTIAL_ALLOW_LEGACY_PLAINTEXT:false}
    vault:
      address: ${VAULT_ADDR:}
      namespace: ${VAULT_NAMESPACE:}
      transit-mount: ${VAULT_TRANSIT_MOUNT:transit}
      key-name: ${VAULT_TRANSIT_KEY:iol-business-credentials}
      token-file: ${VAULT_TOKEN_FILE:}
      # AppRole PROPRE au gateway: sa politique n'accorde que transit/decrypt.
      role-id-file: ${VAULT_ROLE_ID_FILE:}
      secret-id-file: ${VAULT_SECRET_ID_FILE:}

  kafka:
    topics:
      transport-requests: ${APP_KAFKA_TRANSPORT_TOPIC:iol.transport.requests}
      transport-dlq:      ${APP_KAFKA_TRANSPORT_DLQ_TOPIC:iol.transport.requests.dlq}
      status:             ${APP_KAFKA_STATUS_TOPIC:iol.pipeline.status}
      # Topics de commande en sortie, choisis selon la priorite du workflow.
      commands:
        high:    ${APP_KAFKA_COMMANDS_HIGH_TOPIC:iol.pipeline.high}
        default: ${APP_KAFKA_COMMANDS_TOPIC:iol.pipeline.commands}
        low:     ${APP_KAFKA_COMMANDS_LOW_TOPIC:iol.pipeline.low}
    consumer:
      group: ${APP_KAFKA_CONSUMER_GROUP:source-gateway-group}
      # Un transport est long et gourmand: on monte en charge en ajoutant des
      # instances, pas des threads dans une meme instance.
      concurrency: ${APP_KAFKA_CONSUMER_CONCURRENCY:2}
      max-poll-records: 1
      # Marge large: sans elle, un gros transport declencherait un rebalance en
      # pleine extraction.
      max-poll-interval-ms: ${APP_KAFKA_MAX_POLL_INTERVAL_MS:1800000}
      retry-backoff-seconds: ${APP_KAFKA_RETRY_BACKOFF_SECONDS:10}
      max-attempts: ${APP_KAFKA_MAX_ATTEMPTS:5}
    producer:
      status-timeout-seconds: ${APP_KAFKA_STATUS_TIMEOUT_SECONDS:30}

  execution:
    # Duree du bail de reservation d'une execution. Au-dela, une autre instance
    # peut reprendre le travail d'un processus disparu.
    claim-lease-seconds: ${APP_EXECUTION_CLAIM_LEASE_SECONDS:1800}
    claim-heartbeat-seconds: ${APP_EXECUTION_CLAIM_HEARTBEAT_SECONDS:30}
    max-source-connections: ${APP_EXECUTION_MAX_SOURCE_CONNECTIONS:8}
    source-connection-wait-seconds: ${APP_EXECUTION_SOURCE_CONNECTION_WAIT_SECONDS:60}

  # Seuils de production: Kafka reste le transport normal; RustFS est reserve
  # aux volumes atteignant 10 millions de lignes ou 2 Gio estimes.
  spark:
    row:
      threshold: ${SPARK_ROW_THRESHOLD:10000000}
    auto-selection:
      enabled: ${SPARK_AUTO_SELECTION_ENABLED:true}
      file-size-threshold-bytes: ${SPARK_FILE_SIZE_THRESHOLD_BYTES:2147483648}
      jdbc-query-timeout-seconds: ${SPARK_ESTIMATION_TIMEOUT_SECONDS:15}
      jdbc-unknown-mode: ${SPARK_JDBC_UNKNOWN_MODE:SPARK}
      jdbc-rows-per-partition: ${SPARK_JDBC_ROWS_PER_PARTITION:250000}
      jdbc-max-partitions: ${SPARK_JDBC_MAX_PARTITIONS:16}

  interop:
    big-data:
      row-threshold: ${SPARK_ROW_THRESHOLD:10000000}
      byte-threshold: ${SPARK_FILE_SIZE_THRESHOLD_BYTES:2147483648}

  object-storage:
    enabled: ${OBJECT_STORAGE_ENABLED:false}
    provider: ${OBJECT_STORAGE_PROVIDER:S3}
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${OBJECT_STORAGE_BUCKET:iol-source-data}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
    create-bucket-if-missing: ${OBJECT_STORAGE_CREATE_BUCKET_IF_MISSING:true}
    multipart:
      part-size-bytes: ${OBJECT_STORAGE_MULTIPART_PART_SIZE_BYTES:67108864}
