spring:
  kafka:
    properties:
      security.protocol: SSL

server:
  # Aucun endpoint metier n'est expose par ce worker.
  address: 127.0.0.1
  ssl:
    enabled: true
    key-store: ${GATEWAY_TLS_KEYSTORE:file:/run/tls/source-gateway.p12}
    key-store-password: ${GATEWAY_TLS_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
    trust-store: ${IOL_TLS_TRUSTSTORE:file:/run/tls/truststore.p12}
    trust-store-password: ${IOL_TLS_TRUSTSTORE_PASSWORD}
    trust-store-type: PKCS12
    client-auth: need

management:
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_PORT:8088}
    ssl:
      enabled: false

app:
  credentials:
    provider: VAULT_TRANSIT
    environment: production
    allow-legacy-plaintext: false
  object-storage:
    enabled: true
    create-bucket-if-missing: false
