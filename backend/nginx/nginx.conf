# =============================================================================
# Nginx — Reverse Proxy IOL ETL Platform
# =============================================================================
#
# Routage :
#   /api/*              → api-core:8084          (API REST Spring Boot)
#   /openhim-console/*  → openhim-console:80     (Console OpenHIM)
#   /openhim-api/*      → openhim-core:8080      (API OpenHIM pour la console)
#   /interop/*          → openhim-core:5001      (entrée transactionnelle OpenHIM)
#   /mail/*             → mailpit:8025           (boite email locale)
#   /stream/*           → kafka:9092             (futur Kafka HTTP proxy)
#   /                   → frontend React         (fichiers statiques)
#
# Toutes les communications internes entre services se font dans le
# réseau Docker iol-internal — invisible depuis l'extérieur.
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;   # pour l'upload de fichiers CSV/Excel

    # DNS Docker dynamique. Les variables de proxy_pass forcent Nginx a
    # re-resoudre les services apres leur recreation et leur changement d'IP.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Serveur principal ─────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost iol-platform.com;

        set $api_core http://api-core:8084;
        set $mailpit http://mailpit:8025;

        # Headers de sécurité
        add_header X-Frame-Options       "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"    always;
        add_header X-XSS-Protection      "1; mode=block" always;

        # Upload source volumineux. Nginx transmet le flux sans le mettre
        # integralement en tampon ; api-core applique ensuite sa limite metier.
        location = /api/files/upload {
            client_max_body_size 5G;
            proxy_request_buffering off;
            proxy_pass         $api_core;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # ── API REST → api-core ───────────────────────────────────────────────
        location /api/ {
            proxy_pass         $api_core;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Timeouts — les exécutions Hop peuvent être longues
            proxy_connect_timeout  10s;
            proxy_send_timeout     120s;
            proxy_read_timeout     120s;
        }

        # ── Swagger UI → api-core ─────────────────────────────────────────────
        location /swagger-ui/ {
            proxy_pass         $api_core;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        location /api-docs {
            proxy_pass         $api_core;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ── OpenHIM Console → openhim-console ────────────────────────────────
        location = /openhim-console {
            return 301 /openhim-console/;
        }

        location /openhim-console/ {
            set $openhim_console http://openhim-console:80;
            rewrite ^/openhim-console/?(.*)$ /$1 break;
            proxy_pass         $openhim_console;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Prefix /openhim-console;
            proxy_set_header   Connection        "";
        }

        # ── OpenHIM Core API → openhim-core:8080 (HTTPS auto-signé) ─────────
        location = /openhim-api {
            return 301 /openhim-api/;
        }

        location /openhim-api/ {
            set $openhim_api https://openhim-core:8080;
            rewrite ^/openhim-api/?(.*)$ /$1 break;
            proxy_pass         $openhim_api;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Prefix /openhim-api;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   Connection        "";
        }

        # La route exacte /interop appartient à l'interface React. Sans cette
        # priorité, Nginx la redirige automatiquement vers /interop/ et entre
        # en collision avec l'entrée transactionnelle OpenHIM ci-dessous.
        location = /interop {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        # ── Entrée INBOUND interop → OpenHIM router ──────────────────────────
        location /interop/ {
            client_max_body_size 10G;
            proxy_request_buffering off;
            set $openhim_router http://openhim-core:5001;
            proxy_pass         $openhim_router;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Authorization     $http_authorization;
            proxy_set_header   Connection        "";

            proxy_connect_timeout  10s;
            proxy_send_timeout     3600s;
            proxy_read_timeout     3600s;
        }

        location = /mail {
            return 301 /mail/;
        }

        location /mail/ {
            proxy_pass         $mailpit;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Prefix /mail;
        }

        location = /health/live {
            access_log off;
            proxy_pass $api_core/actuator/health/liveness;
        }

        location = /health/ready {
            access_log off;
            proxy_pass $api_core/actuator/health/readiness;
        }

        # ── Frontend React (fichiers statiques) ───────────────────────────────
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            # SPA : toutes les routes non trouvées → index.html (React Router)
            try_files $uri $uri/ /index.html;
        }

        # ── Health check Nginx ────────────────────────────────────────────────
        location /nginx-health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
            access_log off;
        }
    }

    # ── HTTPS (décommenter quand certificats disponibles) ─────────────────────
    # server {
    #     listen 443 ssl;
    #     server_name iol-platform.com;
    #     ssl_certificate     /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     location /api/ { proxy_pass http://api_core; ... }
    #     location /      { root /usr/share/nginx/html; try_files $uri /index.html; }
    # }
}
