worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 4096; }

http {
    access_log /var/log/nginx/access.log;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;

    upstream rustfs_api {
        least_conn;
        server rustfs:9000 max_fails=2 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 9000 ssl;
        server_name rustfs-lb;
        ssl_certificate /run/tls/rustfs-lb.crt;
        ssl_certificate_key /run/tls/rustfs-lb.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /rustfs-lb-health {
            access_log off;
            return 200 "OK\n";
        }

        location / {
            proxy_pass https://rustfs_api;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_ssl_server_name on;
            proxy_ssl_name rustfs;
            proxy_ssl_trusted_certificate /run/tls/ca.pem;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_connect_timeout 5s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }
    }
}
