worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'request_id=$request_id duration=$request_time';
    access_log /var/log/nginx/access.log main;

    resolver 127.0.0.11 valid=10s ipv6=off;
    sendfile on;
    keepalive_timeout 65;
    client_body_timeout 60s;
    client_header_timeout 15s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
        }
        location / {
            return 308 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate /run/tls/nginx.crt;
        ssl_certificate_key /run/tls/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:IOL_SSL:20m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

        set $api_core https://api-core:8084;
        set $keycloak https://keycloak:8443;
        set $openhim_api https://openhim:8080;
        set $openhim_router https://openhim:5000;

        location = /health/live {
            access_log off;
            proxy_pass $api_core/actuator/health/liveness;
            include /etc/nginx/proxy-iol-mtls.conf;
        }

        location = /health/ready {
            access_log off;
            proxy_pass $api_core/actuator/health/readiness;
            include /etc/nginx/proxy-iol-mtls.conf;
        }

        location = /api/files/upload {
            client_max_body_size 5G;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_pass $api_core;
            include /etc/nginx/proxy-iol-mtls.conf;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        location /api/ {
            proxy_pass $api_core;
            include /etc/nginx/proxy-iol-mtls.conf;
            proxy_read_timeout 120s;
        }

        location /auth/ {
            proxy_pass $keycloak;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name keycloak;
            proxy_ssl_trusted_certificate /run/tls/ca.pem;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_certificate /run/tls/nginx.crt;
            proxy_ssl_certificate_key /run/tls/nginx.key;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location = /openhim-api {
            return 308 /openhim-api/;
        }

        location /openhim-api/ {
            rewrite ^/openhim-api/?(.*)$ /$1 break;
            proxy_pass $openhim_api;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name openhim;
            proxy_ssl_trusted_certificate /run/tls/ca.pem;
            proxy_ssl_verify on;
            proxy_ssl_certificate /run/tls/nginx.crt;
            proxy_ssl_certificate_key /run/tls/nginx.key;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization $http_authorization;
        }

        location = /interop {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location /interop/ {
            client_max_body_size 10G;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_pass $openhim_router;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name openhim;
            proxy_ssl_trusted_certificate /run/tls/ca.pem;
            proxy_ssl_verify on;
            proxy_ssl_certificate /run/tls/nginx.crt;
            proxy_ssl_certificate_key /run/tls/nginx.key;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization $http_authorization;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /nginx-health {
            access_log off;
            return 200 "OK\n";
        }
    }
}
