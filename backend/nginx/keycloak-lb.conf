worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
    upstream keycloak_nodes {
        hash $cookie_AUTH_SESSION_ID consistent;
        server keycloak-1:8443 max_fails=2 fail_timeout=10s;
        server keycloak-2:8443 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 8443 ssl;
        server_name keycloak;
        ssl_certificate /run/tls/keycloak.crt;
        ssl_certificate_key /run/tls/keycloak.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_client_certificate /run/tls/ca.pem;
        ssl_verify_client on;

        location /auth/ {
            proxy_pass https://keycloak_nodes;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
            proxy_set_header Connection "";
            proxy_ssl_server_name on;
            proxy_ssl_name keycloak;
            proxy_ssl_trusted_certificate /run/tls/ca.pem;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_certificate /run/tls/keycloak.crt;
            proxy_ssl_certificate_key /run/tls/keycloak.key;
        }
    }
}
